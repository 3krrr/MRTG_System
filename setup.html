<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미래탐구 · 연결 설정</title><script src="config.js" defer></script><script src="setup.261026_1.js" defer></script><link rel="stylesheet" href="classroom.261026_1.css"></head><body><main style="max-width:780px;margin:36px auto;padding:24px"><h1>사이트 연결 설정</h1><p>클래스룸을 사용할 사이트의 연결 정보를 입력해 주세요.</p><form id="setup"><label class="field">① Supabase Project URL<input class="input" name="url" type="url" placeholder="https://프로젝트주소.supabase.co" required></label><label class="field">② Publishable 또는 anon 키<input class="input" name="key" placeholder="sb_publishable_... 또는 anon JWT" required autocomplete="off"></label><p>Supabase 프로젝트의 Connect 또는 Settings → API Keys에서 확인합니다. Secret / service_role 키는 넣지 마세요.</p><button type="submit" class="btn primary">연결 확인</button> <button type="button" class="btn" id="download">config.js 내려받기</button></form><p id="result" class="msw-result" role="status">연결할 프로젝트 정보를 입력해 주세요.</p><p><a class="btn" href="index.html">클래스룸 열기</a></p><p>새 프로젝트에서 내려받은 config.js는 GitHub의 index.html 옆에 올립니다. 기존 프로젝트는 기존 config.js와 CNAME을 유지하세요.</p><textarea hidden id="setup-log" class="v2-log" readonly aria-label="연결 로그"></textarea></main></body></html>
